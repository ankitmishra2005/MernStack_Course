<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <section class="left-section">
            <img
                src="https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?w=800"
                alt="Laundry washing machine"
            >
        </section>

        <section class="right-section">
            <div class="login-box">
                <h1>Hello Again!</h1>
                <p class="description">Welcome back! We missed you!</p>

                <form>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Emailid@site.com"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                    <div class="forgot">
                        <a href="#">Forgot Password</a>
                    </div>

                    <button type="submit">Login</button>
                </form>

                <p class="register">
                    Not a member? <a href="#">Register Now</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
