<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Greeting and Colours</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 id="greeting">Hello</h1>
    <p>Enter your name and click the button to change the greeting.</p>
    <div class="form">
      <input id="nameInput" type="text" placeholder="Enter your name">
      <button id="greetButton">Greet Me</button>
    </div>
    <h2>Click a box to fill it with its colour</h2>
    <div class="boxes">
      <button class="colour-box" data-colour="red">Red</button>
      <button class="colour-box" data-colour="blue">Blue</button>
      <button class="colour-box" data-colour="green">Green</button>
      <button class="colour-box" data-colour="yellow">Yellow</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
