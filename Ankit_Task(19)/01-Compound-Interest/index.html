<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Compound Interest Calculator</h1>
    <p>Calculate the total amount using the compound interest formula.</p>
    <div class="result">
      <p>Principal (P): ₹10,000</p>
      <p>Annual rate (r): 5%</p>
      <p>Compounds per year (n): 1</p>
      <p>Time (t): 3 years</p>
    </div>
    <button id="calculateBtn">Calculate</button>
    <p id="output" aria-live="polite"></p>
    <p class="hint">Open the browser console to see the console.log() output.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
