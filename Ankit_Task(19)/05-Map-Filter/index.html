<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records - Map and Filter</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Student Directory</h1><p>Search student records by name</p></header>

  </main>
  <script src="script.js"></script>
</body>
</html>
