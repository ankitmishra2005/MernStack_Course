<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your Cart | Thala 7</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body>
<header class="site-header"><a class="brand" href="index.html">Thala <span>7.</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="product.html">About</a><a href="product.html">Brands <small>⌄</small></a><a class="active" href="cart.html">More <small>⌄</small></a><a href="payment.html">Contact</a></nav><div class="header-actions"><label class="search-box"><span>⌕</span><input type="search" placeholder="Search"></label><a class="cart-link" href="cart.html">♧ <span id="cartCount">0</span></a><div class="avatar">A</div></div></header>
<main class="wrap cart-page">
  <p class="eyebrow">YOUR PICKS</p><h1>Shopping Cart</h1>
  <div class="cart-layout">
    <section class="cart-left"><div class="cart-table-head"><span>Product</span><span>Quantity</span><span>Price</span><span></span></div><div id="cartItems"></div><a class="continue-link" href="product.html">‹ &nbsp; Continue Shopping</a></section>
    <aside class="summary-card"><h2>Order Summary</h2><label class="coupon-label" for="couponInput">Enter Coupon Code</label><div class="coupon-row"><input id="couponInput" placeholder="COUPON CODE"><button id="applyCoupon" class="button button-blue">Apply Coupon</button></div><p id="couponMessage" class="coupon-message"></p><div class="summary-line"><span>Sub Total</span><strong id="subtotal">₹0</strong></div><div class="summary-line"><span>Taxes (if applicable)</span><strong id="taxes">₹0</strong></div><div class="summary-line"><span>Discount</span><strong id="discount">₹0</strong></div><div class="summary-line total-line"><span>Total</span><strong id="total">₹0</strong></div><a href="payment.html" class="button button-orange full-button">Pay Now <span id="payTotal">₹0</span></a><div class="payment-logos"><span>🔒 SECURE</span><b>Razorpay</b><span>✓ VERIFIED</span></div></aside>
  </div>
</main>
<footer class="footer"><a class="brand" href="index.html">Thala <span>7.</span></a><p>Made for every step. © 2026 Thala 7 Sneaker Store.</p></footer>
